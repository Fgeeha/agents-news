[project]
name = "agents-news"
version = "0.1.0"
description = "Группа LLM-агентов: парсинг новостных RSS, переработка новостей профильными экспертами, независимая проверка другой моделью"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "openai>=1.40",
    "pyyaml>=6.0",
    "trafilatura>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agents-news = "agents_news.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_news"]

[tool.ruff.lint]
# Осознанные отступления от максимального набора: широкий except Exception
# вокруг сетевых вызовов и наивные даты допустимы в локальном пайплайне.
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
# RUF001-003 ложно срабатывают на кириллицу в русских промптах и комментариях
ignore = ["RUF001", "RUF002", "RUF003"]
