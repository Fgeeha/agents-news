<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Конвейер agents-news</title>
  <desc id="desc">RSS-ленты проходят дедупликацию, фильтр темы, переработку экспертом и проверку рецензентом; принятые статьи попадают в out, отклонённые — в rejected.</desc>

  <rect width="1200" height="430" rx="24" fill="#0b0e14"/>
  <rect x="0.75" y="0.75" width="1198.5" height="428.5" rx="23.5" fill="none" stroke="#1c2230" stroke-width="1.5"/>

  <text x="600" y="42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b949e">весь трафик моделей — через шлюз LiteLLM · алиасы gate / expert / reviewer / embed</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <!-- этап 1: RSS -->
    <g transform="translate(48,80)">
      <rect width="192" height="120" rx="12" fill="#11161f" stroke="#2a3140" stroke-width="1.5"/>
      <text x="20" y="38" font-size="22" font-weight="600" fill="#e8e6e0">RSS-ленты</text>
      <text x="20" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b949e">10 источников:</text>
      <text x="20" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b949e">СМИ · регион · гос</text>
    </g>
    <!-- этап 2: дедуп -->
    <g transform="translate(276,80)">
      <rect width="192" height="120" rx="12" fill="#11161f" stroke="#2a3140" stroke-width="1.5"/>
      <text x="20" y="38" font-size="22" font-weight="600" fill="#e8e6e0">Дедупликация</text>
      <text x="20" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b949e">id → Жаккар →</text>
      <text x="20" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b949e">bge-m3 → gate</text>
    </g>
    <!-- этап 3: фильтр темы -->
    <g transform="translate(504,80)">
      <rect width="192" height="120" rx="12" fill="#11161f" stroke="#2a3140" stroke-width="1.5"/>
      <text x="20" y="38" font-size="22" font-weight="600" fill="#e8e6e0">Фильтр темы</text>
      <text x="20" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b949e">qwen2.5:7b</text>
      <text x="20" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#d29922">ДА / НЕТ</text>
    </g>
    <!-- этап 4: эксперт -->
    <g transform="translate(732,80)">
      <rect width="192" height="120" rx="12" fill="#11161f" stroke="#2a3140" stroke-width="1.5"/>
      <text x="20" y="38" font-size="22" font-weight="600" fill="#e8e6e0">Эксперт</text>
      <text x="20" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b949e">qwen2.5:14b</text>
      <circle cx="26" cy="94" r="7" fill="#3fb950"/>
      <circle cx="48" cy="94" r="7" fill="#58a6ff"/>
      <circle cx="70" cy="94" r="7" fill="#f47067"/>
      <text x="88" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b949e">3 темы</text>
    </g>
    <!-- этап 5: рецензент -->
    <g transform="translate(960,80)">
      <rect width="192" height="120" rx="12" fill="#11161f" stroke="#d29922" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="20" y="38" font-size="22" font-weight="600" fill="#e8e6e0">Рецензент</text>
      <text x="20" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b949e">gemma2:9b</text>
      <text x="20" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#d29922">другое семейство</text>
    </g>

    <!-- горизонтальные стрелки -->
    <g stroke="#3d4657" stroke-width="2.5" fill="#3d4657">
      <line x1="240" y1="140" x2="266" y2="140"/><path d="M266 134 l12 6 -12 6 z"/>
      <line x1="468" y1="140" x2="494" y2="140"/><path d="M494 134 l12 6 -12 6 z"/>
      <line x1="696" y1="140" x2="722" y2="140"/><path d="M722 134 l12 6 -12 6 z"/>
      <line x1="924" y1="140" x2="950" y2="140"/><path d="M950 134 l12 6 -12 6 z"/>
    </g>

    <!-- ветка: не по теме -->
    <g stroke="#3d4657" stroke-width="2" fill="none">
      <path d="M600 200 v66"/>
    </g>
    <path d="M594 266 l6 12 6 -12 z" fill="#3d4657"/>
    <g transform="translate(474,282)">
      <rect width="252" height="78" rx="12" fill="#11161f" stroke="#2a3140" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="20" y="34" font-size="20" font-weight="600" fill="#8b949e">НЕТ — пропуск</text>
      <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b949e">ничего не создаётся</text>
    </g>

    <!-- ветки вердикта -->
    <g stroke="#3d4657" stroke-width="2" fill="none">
      <path d="M1032 200 v30 h-142 v36"/>
      <path d="M1080 200 v30 h20 v36"/>
    </g>
    <path d="M884 266 l6 12 6 -12 z" fill="#3d4657"/>
    <path d="M1094 266 l6 12 6 -12 z" fill="#3d4657"/>
    <g transform="translate(790,282)">
      <rect width="200" height="78" rx="12" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="20" y="34" font-size="20" font-weight="600" fill="#3fb950">ПРИНЯТО</text>
      <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#b8b4ab">out/дата/тема/</text>
    </g>
    <g transform="translate(1010,282)">
      <rect width="142" height="78" rx="12" fill="#f47067" fill-opacity="0.08" stroke="#f47067" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="20" y="34" font-size="20" font-weight="600" fill="#f47067">ОТКЛОНЕНО</text>
      <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#b8b4ab">rejected/</text>
    </g>
  </g>
</svg>
